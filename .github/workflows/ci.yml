name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Static Analysis (Lint)
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m

      - name: Run Unit Tests
        run: go test -v -race $(go list ./... | grep -v '/test/integration')

      - name: Build Binary
        run: go build -v ./cmd/proxy

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: azs3-proxy:latest
