
# file: put-1MiB.yml
warp:
  api: v1
  benchmark: put

  quiet: false
  no-color: false
  json: false

  region: "{{.Region}}"
  access-key: "{{.AccessKey}}"
  secret-key: "{{.SecretKey}}"
  host: "{{.Host}}"
  tls: {{.TLS}}

  bucket: "{{.Bucket}}"
  bench-data: "{{.BenchData}}"

  params:
    duration: 180s
    concurrent: {{.Concurrent}}

    # PUT vs POST Object toggle
    post: false

    obj:
      size: 10MiB
      rand-size: false
