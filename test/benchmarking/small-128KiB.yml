
# file: rabata-small-put-128KiB.yml
warp:
  api: v1
  benchmark: put

  quiet: false
  no-color: false
  json: false

  region: "{{.Region}}"
  access-key: "{{.AccessKey}}"
  secret-key: "{{.SecretKey}}"
  host: "{{.Host}}"
  tls: {{.TLS}}

  bucket: "{{.Bucket}}"
  bench-data: "proxy-small-put-128KiB.csv.zst"

  params:
    duration: 300s
    concurrent: 8
    post: false

    obj:
      size: 128KiB
      rand-size: false
