
# file: rabata-put-1MiB.yml
warp:
  api: v1
  benchmark: put

  quiet: false
  no-color: false
  json: false

  region: "{{.Region}}"
  access-key: "{{.AccessKey}}"
  secret-key: "{{.SecretKey}}"
  host: "{{.Host}}"
  tls: {{.TLS}}

  bucket: "{{.Bucket}}"
  bench-data: "proxy-put-1MiB.csv.zst"

  params:
    duration: 300s
    concurrent: 8

    # PUT vs POST Object toggle
    post: false

    obj:
      size: 1MiB
      rand-size: false
