receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  resourcedetection:
    detectors: [env, system]
    timeout: 2s
    override: false

exporters:
  debug:
    verbosity: detailed
  azuremonitor:
    connection_string: "${env:AZURE_MONITOR_CONNECTION_STRING}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [debug, azuremonitor]
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [debug, azuremonitor]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [debug, azuremonitor]
